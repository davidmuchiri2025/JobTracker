name: Deploy API to Azure App Service

on:
  push:
    branches: ["main"]
    paths:
      - "src/JobTracker.Api/**"
      - "src/JobTracker.Shared/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  PROJECT_PATH: "src/JobTracker.Api/JobTracker.Api.csproj"
  PUBLISH_DIR: "./publish/api"
  # Replace with your Azure App Service name (API), e.g. jobtracker-api-contoso
  AZURE_WEBAPP_NAME: "jobtracker-api-placeholder"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore JobTracker.slnx

      - name: Build
        run: dotnet build JobTracker.slnx -c Release --no-restore

      - name: Publish API
        run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -o ${{ env.PUBLISH_DIR }} --no-build

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_API }}
          package: ${{ env.PUBLISH_DIR }}
