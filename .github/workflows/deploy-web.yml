name: Deploy Web to Azure App Service

on:
  push:
    branches: ["main"]
    paths:
      - "src/JobTracker.Web/**"
      - "src/JobTracker.Shared/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  PROJECT_PATH: "src/JobTracker.Web/JobTracker.Web/JobTracker.Web.csproj"
  PUBLISH_DIR: "./publish/web"
  # Replace with your Azure App Service name (Web), e.g. jobtracker-web-contoso
  AZURE_WEBAPP_NAME: "jobtracker-web-placeholder"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore JobTracker.slnx

      - name: Build
        run: dotnet build JobTracker.slnx -c Release --no-restore

      - name: Publish Web
        run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -o ${{ env.PUBLISH_DIR }} --no-build

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_WEB }}
          package: ${{ env.PUBLISH_DIR }}
